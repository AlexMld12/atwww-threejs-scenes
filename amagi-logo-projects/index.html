<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMAGI — Projects logo (test)</title>
    <!-- Local test page: ONLY the logo. Mirrors the Webflow structure:
         .projects-header (relative) > .projects-logo (absolute, 100% × 150%).
         The heading text, search bar and background are built in Webflow. -->
    <style>
      html, body { margin: 0; background: #000; }
      .projects-hero { min-height: 100vh; padding-top: 170px; }
      .projects-header { position: relative; width: min(600px, 90vw); height: 360px; margin: 0 auto; }
      .projects-logo { position: absolute; top: 0; left: 0; width: 100%; height: 150%; }
      .after { height: 60vh; }
    </style>
  </head>
  <body>
    <section class="projects-hero">
      <div class="projects-header">
        <div class="projects-logo"></div>
      </div>
    </section>
    <div class="after"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
