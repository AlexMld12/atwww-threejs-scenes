<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preloader — switch care se închide</title>
<style>
  :root{
    --bg:#051b1c; --mint:#20e7b7; --dim:#0c4a45; --panel:rgba(4,20,21,.86);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--mint);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* grilă de blueprint, pur CSS, sub canvas */
  #grid{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(to right, rgba(32,231,183,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(32,231,183,.055) 1px, transparent 1px),
      linear-gradient(to right, rgba(32,231,183,.028) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(32,231,183,.028) 1px, transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px}
  #grid.off{display:none}

  #ui{position:fixed;top:14px;right:14px;width:274px;max-height:calc(100vh - 28px);
    overflow-y:auto;background:var(--panel);border:1px solid var(--dim);border-radius:10px;
    padding:12px 13px;backdrop-filter:blur(8px)}
  #ui h3{margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#5ee7c6;font-weight:600}
  #ui h4{margin:14px 0 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:#3d8f80;font-weight:600;border-top:1px solid rgba(32,231,183,.14);padding-top:9px}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row label{flex:0 0 96px;font-size:11px;color:#7fd8c4}
  .row output{flex:0 0 46px;text-align:right;font-size:11px;color:var(--mint);
    font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;min-width:0;height:3px;-webkit-appearance:none;appearance:none;
    background:var(--dim);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
    border-radius:50%;background:var(--mint);cursor:pointer}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  button{flex:1 1 auto;padding:7px 9px;font:inherit;font-size:11px;color:var(--mint);
    background:rgba(32,231,183,.08);border:1px solid var(--dim);border-radius:6px;cursor:pointer}
  button:hover{background:rgba(32,231,183,.17)}
  button.on{background:var(--mint);color:#04191a;border-color:var(--mint)}
  #stat{position:fixed;left:14px;bottom:14px;font-size:11px;color:#3d8f80;
    letter-spacing:.06em;line-height:1.7}
  #stat b{color:var(--mint);font-weight:500;font-variant-numeric:tabular-nums}
  #err{position:fixed;left:14px;top:14px;max-width:60ch;color:#ff8a7a;font-size:12px;
    white-space:pre-wrap;display:none}
  input[type=color]{flex:1;min-width:0;height:22px;padding:0;border:1px solid var(--dim);
    border-radius:4px;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
  #saved{margin-top:8px;font-size:11px;line-height:1.6}
  #saved a{color:#04191a;background:var(--mint);display:block;padding:6px 8px;
    border-radius:6px;text-decoration:none;text-align:center}
</style>
</head>
<body>
<div id="grid"></div>
<div id="app"></div>

<div id="ui">
  <h3>Preloader — switch</h3>

  <div class="row">
    <label for="s_prog">Progres</label>
    <input type="range" id="s_prog" min="0" max="1" step="0.001" value="0">
    <output id="o_prog">0%</output>
  </div>
  <div class="btns">
    <button id="b_open">Desfă</button>
    <button id="b_close">Închide</button>
    <button id="b_loop" class="on">Buclă</button>
  </div>

  <h4>Mișcare</h4>
  <div class="row"><label for="s_dur">Durată</label>
    <input type="range" id="s_dur" min="0.4" max="4" step="0.05" value="1.5"><output id="o_dur">1.50s</output></div>
  <div class="row"><label for="s_stag">Decalaj piese</label>
    <input type="range" id="s_stag" min="0" max="0.6" step="0.01" value="0"><output id="o_stag">0.00</output></div>
  <div class="row"><label for="s_hold">Pauză închis</label>
    <input type="range" id="s_hold" min="0" max="2.5" step="0.05" value="0.8"><output id="o_hold">0.80s</output></div>
  <div class="row"><label for="s_spin">Rotire</label>
    <input type="range" id="s_spin" min="0" max="40" step="0.5" value="0"><output id="o_spin">0°</output></div>
  <div class="row"><label for="s_follow">Cadrul urmărește</label>
    <input type="range" id="s_follow" min="0" max="1" step="0.01" value="0"><output id="o_follow">0.00</output></div>

  <h4>Linie</h4>
  <div class="row"><label for="s_lw">Grosime muchii</label>
    <input type="range" id="s_lw" min="0.5" max="6" step="0.1" value="1.0"><output id="o_lw">1.0</output></div>
  <div class="row"><label for="s_sil">Grosime siluetă</label>
    <input type="range" id="s_sil" min="0" max="6" step="0.1" value="0.8"><output id="o_sil">0.8</output></div>
  <div class="row"><label for="s_ang">Prag muchii</label>
    <input type="range" id="s_ang" min="1" max="60" step="1" value="25"><output id="o_ang">25°</output></div>
  <div class="row"><label for="s_zoom">Încadrare</label>
    <input type="range" id="s_zoom" min="0.5" max="1.6" step="0.01" value="1"><output id="o_zoom">1.00</output></div>
  <div class="btns">
    <button id="b_fill" class="on">Umplere opacă</button>
    <button id="b_grid" class="on">Grilă</button>
  </div>
  <div class="btns">
    <button id="b_orbit">Rotire liberă</button>
  </div>
  <div class="btns">
    <button id="b_front">Din față</button>
  </div>

  <h4>Culoare</h4>
  <div class="row"><label for="c_line">Linii</label>
    <input type="color" id="c_line" value="#ffffff"><output id="o_cline">#ffffff</output></div>
  <div class="row"><label for="c_bg">Fundal</label>
    <input type="color" id="c_bg" value="#051b1c"><output id="o_cbg">#051b1c</output></div>
  <div class="btns">
    <button id="b_swap">Inversează</button>
    <button id="b_reset">Culori inițiale</button>
  </div>

  <h4>Noise (identic cu intro/outro)</h4>
  <div class="row"><label for="s_noise">Intensitate</label>
    <input type="range" id="s_noise" min="0" max="0.3" step="0.002" value="0.04"><output id="o_noise">0.040</output></div>
  <div class="row"><label for="s_nbright">Duritate</label>
    <input type="range" id="s_nbright" min="1" max="9" step="0.1" value="5"><output id="o_nbright">5.00</output></div>
  <div class="row"><label for="s_nsize">Granulație</label>
    <input type="range" id="s_nsize" min="1" max="6" step="1" value="2"><output id="o_nsize">2px</output></div>
  <div class="row"><label for="s_nspeed">Viteză</label>
    <input type="range" id="s_nspeed" min="0" max="4" step="0.05" value="1"><output id="o_nspeed">1.00</output></div>
  <div class="row"><label for="c_noise">Culoare</label>
    <input type="color" id="c_noise" value="#9fe8d4"><output id="o_cnoise">#9fe8d4</output></div>

  <h4>Export</h4>
  <div class="row"><label for="s_scale">Scală</label>
    <input type="range" id="s_scale" min="1" max="4" step="1" value="2"><output id="o_scale">2×</output></div>
  <div class="btns">
    <button id="b_png">⬇ Salvează PNG</button>
  </div>
  <div id="saved"></div>
</div>

<div id="stat"></div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.176.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.176.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const BG = 0x051b1c, MINT = 0x20e7b7;
// Culoarea liniilor: ALB (2026-09-15, cererea userului). Mint-ul rămâne declarat
// pentru grila CSS de blueprint și pentru butonul de resetare a culorilor.
const LINE_COL = 0xffffff;

addEventListener('error', (e) => {
  const d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = (d.textContent ? d.textContent + '\n' : '') + (e.message || e);
});

// Deplasarea de la ASAMBLAT la DESFĂCUT, măsurată pe rig-ul real (hero f1 vs f180), în mm.
// `up` urcă pe Y; `depth` vine din înclinarea de 5° a tastaturii -> pe Z în spațiul glTF.
// Ordinea e de jos în sus și dictează și decalajul animației.
const PIECES = [
  { id:'p1_pin_contact',    label:'pin de contact', up:  0.00, depth: 0.00 },
  { id:'p2_led',            label:'LED',            up: 14.19, depth: 1.24 },
  { id:'p3_bottom_housing', label:'carcasă inf.',   up: 28.38, depth: 2.48 },
  { id:'p4_contacts',       label:'lamelă contact', up: 42.56, depth: 3.72 },
  { id:'p5_spring',         label:'arc',            up: 56.75, depth: 4.96 },
  { id:'p6_top_housing',    label:'carcasă sup.',   up: 70.94, depth: 6.20 },
  { id:'p7_stem',           label:'stem',           up: 85.13, depth: 7.44 },
  { id:'p8_keycap',         label:'keycap',         up:105.52, depth: 9.23 },
];
const MM = 0.001;
const meanUp    = PIECES.reduce((s, p) => s + p.up,    0) / PIECES.length;
const meanDepth = PIECES.reduce((s, p) => s + p.depth, 0) / PIECES.length;

const app = document.getElementById('app');
// preserveDrawingBuffer: ca toDataURL să găsească pixelii la salvarea PNG
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(BG, 1);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.001, 100);
camera.position.set(0, 0, 1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enabled = false;

const group = new THREE.Group();
scene.add(group);

const fillMat = new THREE.MeshBasicMaterial({
  color: BG,
  // împinge umplerea în spate ca liniile coincidente să nu clipească
  polygonOffset: true, polygonOffsetFactor: 1.2, polygonOffsetUnits: 1.2,
});
const lineMat = new LineMaterial({ color: LINE_COL, linewidth: 1.0, worldUnits: false });

// EdgesGeometry dă doar muchii cu unghi diedru peste prag — NU dă siluete. Pe piesele
// rotunjite (keycap-ul mai ales) asta înseamnă că nu se desenează aproape nimic.
// Coajă inversată: aceeași geometrie pe BackSide, împinsă pe normală în spațiu-vedere cu
// o valoare exprimată în unități de lume, recalculată la fiecare resize ca să rămână
// constantă în pixeli. Merge și pe piesele subțiri, unde scalarea uniformă se rupe.
const outlineMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { uColor: { value: new THREE.Color(LINE_COL) }, uWidth: { value: 0.0004 } },
  vertexShader: `
    uniform float uWidth;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vec3 n = normalize(normalMatrix * normal);
      mv.xyz += n * uWidth;
      gl_Position = projectionMatrix * mv;
    }`,
  // `colorspace_fragment` e obligatoriu: fără el culoarea liniară se scrie direct într-un
  // framebuffer sRGB, deci silueta iese cu altă nuanță decât liniile din LineMaterial
  // (care face conversia). Se vedea mai ales pe keycap, care e aproape numai siluetă.
  fragmentShader: `
    uniform vec3 uColor;
    void main() {
      gl_FragColor = vec4(uColor, 1.0);
      #include <colorspace_fragment>
    }`,
});

/* ---------- noise TV, quad în spațiu-ecran, randat peste scenă ---------- */
const noiseScene = new THREE.Scene();
const noiseCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
// ⚠️ Formula ESTE cea din preview.html / outro_preview.html, nu una proprie
// (2026-09-15, cererea userului: „același noise ca în intro"). Înainte aici erau
// „purici izolați" cu `step(1 - uDensity, n)` — contrast mare, aprinde o fracțiune de
// celule la intensitate aproape plină. Diferit vizual de `pow(n, uPow)`, care păstrează
// doar scânteile luminoase și dă static fin. Valorile sunt identice cu celelalte două
// scene: intensitate 0.04, granulație 2.0, duritate 5.0, culoare #9fe8d4.
// Trei detalii contează, al doilea e ușor de greșit:
//  - grila e în PIXELI (gl_FragCoord), nu în UV, altfel puricii se întind cu rezoluția;
//  - timpul intră cu multiplicatori DIFERIȚI pe cele două axe. Adunat la fel pe amândouă,
//    grila alunecă în diagonală cu o celulă pe cadru — greșeală reparată deja o dată în
//    outro_preview.html. Așa, câmpul se reseamănă la fiecare cadru;
//  - `pow(n, uPow)` păstrează doar scânteile luminoase => static, nu ceață uniformă.
//
// ⚠️ Shader-ul NU are `#include <colorspace_fragment>`, deși restul materialelor din
// preloader îl au, iar versiunea anterioară a acestui quad îl avea. Motivul: în
// intro/outro noise-ul stă în `GradePass`, care rulează DUPĂ `OutputPass`, deci scrie
// direct în spațiu de AFIȘARE. Aici conversia liniar → sRGB amplifica puternic valorile
// mici (0.01 liniar ≈ 0.1 în sRGB), deci aceleași cifre dădeau grain de ~3.6× mai
// vizibil — măsurat pe deviația standard a unui petic plat de fundal: 13.3 față de 3.7
// în intro. Nu adăuga includerea „pentru consistență cu celelalte materiale".
// ⚠️ Și nu scrie backtick-uri în comentariile DINĂUNTRUL template-ului GLSL: închid
// string-ul JS și rup parsarea modulului. Explicațiile stau aici, în afara lui.
const noiseMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:{value:0}, uNoise:{value:0.04}, uGrain:{value:2.0}, uPow:{value:5.0},
    uSpeed:{value:1.0},
    uColor:{value:new THREE.Color(0x9fe8d4)},
  },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime, uNoise, uGrain, uPow, uSpeed;
    uniform vec3 uColor;
    void main(){
      float t = uTime * uSpeed;
      vec2 ip = floor(gl_FragCoord.xy / max(uGrain, 1.0));
      float n = fract(sin(dot(ip + vec2(t * 61.7, t * 23.3),
                             vec2(12.9898, 78.233))) * 43758.5453);
      gl_FragColor = vec4(uColor * (uNoise * pow(n, uPow)), 1.0);
    }`,
  depthTest: false, depthWrite: false, transparent: true, blending: THREE.AdditiveBlending,
});
noiseScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), noiseMat));

const parts = [];     // { id, node, fill, shell, line, srcGeom, offset }
let contentRadius = 0.08, contentCenter = new THREE.Vector3();
const frameOpen   = { c: new THREE.Vector3(), r: 0.08 };
const frameClosed = { c: new THREE.Vector3(), r: 0.02 };
// declarat aici, nu lângă applyFrame: bucla pornește înainte de acea secțiune și
// ar prinde `fc` în zona moartă temporală
const fc = new THREE.Vector3();

function buildEdges(part, deg) {
  const eg = new THREE.EdgesGeometry(part.srcGeom, deg);
  const lg = new LineSegmentsGeometry().fromEdgesGeometry(eg);
  if (part.line) { part.node.remove(part.line); part.line.geometry.dispose(); }
  const seg = new LineSegments2(lg, lineMat);
  seg.computeLineDistances();
  seg.frustumCulled = false;
  part.node.add(seg);
  part.line = seg;
  part.segCount = eg.attributes.position.count / 2;
  eg.dispose();
}

const loader = new GLTFLoader();
loader.load('../web/public/models/preloader.glb', (gltf) => {
  const byId = new Map();
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const id = o.name.replace(/^CL_/, '').replace(/_\d+$/, '');
    byId.set(id, o);
  });

  const missing = PIECES.filter(p => !byId.has(p.id)).map(p => p.id);
  if (missing.length) throw new Error('lipsesc din GLB: ' + missing.join(', '));

  for (const spec of PIECES) {
    const src = byId.get(spec.id);
    const geom = src.geometry.clone();
    geom.applyMatrix4(src.matrixWorld);       // coacem transformul, ca pivotul să fie global

    geom.computeVertexNormals();               // GLB-ul e fără normale; coaja are nevoie de ele

    const node = new THREE.Group();
    const shell = new THREE.Mesh(geom, outlineMat);   // silueta
    shell.frustumCulled = false;
    node.add(shell);
    const fill = new THREE.Mesh(geom, fillMat);       // umplerea opacă acoperă interiorul cojii
    fill.frustumCulled = false;
    node.add(fill);
    group.add(node);

    // Offset-urile brute pleacă toate în sus de la piesa de jos (0 … 105 mm), deci
    // asamblarea s-ar termina la baza stivei. Scăzând media, desfacerea devine simetrică
    // față de tasta montată: piesele de jos coboară, cele de sus urcă, iar închiderea se
    // face în mijloc de la sine — fără să mut grupul în timpul animației.
    const part = { id: spec.id, label: spec.label, node, fill, shell, srcGeom: geom,
                   offset: new THREE.Vector3(0, (spec.up - meanUp) * MM,
                                                (spec.depth - meanDepth) * MM) };
    buildEdges(part, +ui.s_ang.value);
    parts.push(part);
  }

  // Două încadrări: pe starea desfăcută (înaltă) și pe cea închisă (mică). Cadrul
  // interpolează între ele odată cu progresul — altfel tasta închisă rămâne minusculă
  // într-un cadru dimensionat pentru stiva de 125 mm.
  const boxOpen = new THREE.Box3(), boxClosed = new THREE.Box3();
  for (const p of parts) {
    const b = new THREE.Box3().setFromBufferAttribute(p.srcGeom.attributes.position);
    boxClosed.union(b);
    boxOpen.union(b).union(b.clone().translate(p.offset));
  }
  const half = (bx) => Math.max(bx.max.y - bx.min.y, bx.max.x - bx.min.x) * 0.5;
  boxOpen.getCenter(frameOpen.c);   frameOpen.r   = half(boxOpen);
  boxClosed.getCenter(frameClosed.c); frameClosed.r = half(boxClosed);
  contentCenter.copy(frameOpen.c); contentRadius = frameOpen.r;
  resize();
  setProgress(qs.has('p') ? +qs.get('p') : 0);
  document.getElementById('stat').innerHTML =
    `<b>${parts.length}</b> piese · <b>${parts.reduce((s,p)=>s+p.segCount,0)}</b> segmente de linie` +
    ` · <b>${parts.reduce((s,p)=>s+(p.srcGeom.index?p.srcGeom.index.count:p.srcGeom.attributes.position.count)/3,0)}</b> triunghiuri`;
}, undefined, (e) => {
  const d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'Nu am putut încărca preloader.glb.\n' +
    'Pornește un server în folderul preloader/:\n  python3 -m http.server 8790\n' +
    'apoi deschide http://127.0.0.1:8790/preloader.html\n\n' + (e?.message || e);
});

/* ---------- animație ---------- */
const ui = {};
// `output` trebuie inclus: afișajele de valori sunt <output>, altfel ui.o_* e undefined
for (const el of document.querySelectorAll('input,button,output')) ui[el.id] = el;

// Liniar, fără easing. Un easeInOutCubic dădea accelerare la plecare și frânare la
// sosire, care se citea ca un mic recul. Decalajul dintre piese e singura nuanță.
const ease = t => t;

let progress = 0;          // 0 = desfăcut, 1 = închis
function setProgress(p) {
  progress = Math.min(1, Math.max(0, p));
  const stag = +ui.s_stag.value;
  const n = parts.length;
  for (let i = 0; i < n; i++) {
    // piesa de sus pornește ultima și ajunge ultima -> se vede clar cum se așază
    const w = n > 1 ? (i / (n - 1)) : 0;
    const span = 1 - stag;
    const local = span <= 0 ? progress : (progress - w * stag) / span;
    const k = ease(Math.min(1, Math.max(0, local)));
    const p2 = parts[i];
    p2.node.position.copy(p2.offset).multiplyScalar(1 - k);
  }
  ui.o_prog.textContent = Math.round(progress * 100) + '%';
  if (ui.s_prog.value !== String(progress)) ui.s_prog.value = progress;
  applyFrame();
}

// ?p=0.5 fixează progresul, ?loop=0 oprește bucla — util pentru capturi de cadru
const qs = new URLSearchParams(location.search);
let mode = qs.get('loop') === '0' || qs.has('p') ? 'idle' : 'loop';
let dir = 1, holdUntil = 0;
const clock = new THREE.Clock();
if (mode === 'idle') ui.b_loop.classList.remove('on');

function tick() {
  const dt = clock.getDelta();
  const dur = +ui.s_dur.value;
  const now = performance.now() / 1000;

  if (mode === 'loop') {
    if (now >= holdUntil) {
      setProgress(progress + dir * dt / dur);
      if (progress >= 1) { dir = -1; holdUntil = now + +ui.s_hold.value; }
      else if (progress <= 0) { dir = 1; holdUntil = now + +ui.s_hold.value * 0.5; }
    }
  } else if (mode === 'to1' || mode === 'to0') {
    const target = mode === 'to1' ? 1 : 0;
    const step = dt / dur;
    setProgress(progress + Math.sign(target - progress) * step);
    if (Math.abs(progress - target) < 1e-3) { setProgress(target); mode = 'idle'; }
  }

  const spin = +ui.s_spin.value;
  group.rotation.y = spin ? Math.sin(now * 0.5) * THREE.MathUtils.degToRad(spin) : 0;

  controls.update();
  noiseMat.uniforms.uTime.value = now;   // timp continuu; viteza intră prin uSpeed
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(scene, camera);
  if (noiseMat.uniforms.uNoise.value > 0.0005) renderer.render(noiseScene, noiseCam);
}
tick();

/* ---------- încadrare ---------- */
function applyFrame() {
  const t = ease(progress) * +ui.s_follow.value;
  const r = THREE.MathUtils.lerp(frameOpen.r, frameClosed.r, t) * 1.3 / +ui.s_zoom.value;
  fc.lerpVectors(frameOpen.c, frameClosed.c, t);
  const a = innerWidth / innerHeight;
  if (a >= 1) { camera.top = r; camera.bottom = -r; camera.left = -r * a; camera.right = r * a; }
  else        { camera.left = -r; camera.right = r; camera.top = r / a; camera.bottom = -r / a; }
  camera.near = 0.001; camera.far = 100;
  camera.updateProjectionMatrix();
  if (!controls.enabled) {
    const d = Math.max(0.5, frameOpen.r * 12);
    camera.position.set(fc.x, fc.y, fc.z + d);
    controls.target.copy(fc);
  }
  // grosimea siluetei, exprimată în pixeli -> unități de lume ale camerei ortografice
  outlineMat.uniforms.uWidth.value =
    (camera.top - camera.bottom) / innerHeight * +ui.s_sil.value;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  lineMat.resolution.set(innerWidth * renderer.getPixelRatio(),
                         innerHeight * renderer.getPixelRatio());
  applyFrame();
}
addEventListener('resize', resize);

function frontView() {
  controls.enabled = false;
  ui.b_orbit.classList.remove('on');
  applyFrame();
  controls.update();
}

/* ---------- controale ---------- */
const bind = (id, out, fmt, fn) => {
  const el = ui[id];
  const apply = () => { ui[out].textContent = fmt(+el.value); fn && fn(+el.value); };
  el.addEventListener('input', apply); apply();
};
bind('s_dur',  'o_dur',  v => v.toFixed(2) + 's');
bind('s_stag', 'o_stag', v => v.toFixed(2), () => setProgress(progress));
bind('s_hold', 'o_hold', v => v.toFixed(2) + 's');
bind('s_spin', 'o_spin', v => v.toFixed(0) + '°');
bind('s_follow','o_follow', v => v.toFixed(2), () => applyFrame());
bind('s_lw',   'o_lw',   v => v.toFixed(1), v => { lineMat.linewidth = v; });
bind('s_sil',  'o_sil',  v => v.toFixed(1), () => applyFrame());
bind('s_ang',  'o_ang',  v => v.toFixed(0) + '°', v => {
  for (const p of parts) buildEdges(p, v);
  const d = document.getElementById('stat');
  if (d && parts.length) d.innerHTML =
    `<b>${parts.length}</b> piese · <b>${parts.reduce((s,p)=>s+p.segCount,0)}</b> segmente de linie` +
    ` · <b>${parts.reduce((s,p)=>s+(p.srcGeom.index?p.srcGeom.index.count:p.srcGeom.attributes.position.count)/3,0)}</b> triunghiuri`;
});
bind('s_zoom', 'o_zoom', v => v.toFixed(2), () => resize());

ui.s_prog.addEventListener('input', () => { mode = 'idle'; ui.b_loop.classList.remove('on'); setProgress(+ui.s_prog.value); });
ui.b_close.onclick = () => { mode = 'to1'; ui.b_loop.classList.remove('on'); };
ui.b_open.onclick  = () => { mode = 'to0'; ui.b_loop.classList.remove('on'); };
ui.b_loop.onclick  = () => {
  const on = mode !== 'loop';
  mode = on ? 'loop' : 'idle';
  ui.b_loop.classList.toggle('on', on);
  if (on) { dir = progress < 0.5 ? 1 : -1; holdUntil = 0; }
};
ui.b_fill.onclick = () => {
  const on = !ui.b_fill.classList.contains('on');
  ui.b_fill.classList.toggle('on', on);
  // coaja merge împreună cu umplerea: fără umplerea din față, silueta de pe BackSide
  // s-ar vedea ca o pată plină de mint, nu ca un contur
  for (const p of parts) { p.fill.visible = on; p.shell.visible = on; }
};
ui.b_grid.onclick = () => {
  const on = !ui.b_grid.classList.contains('on');
  ui.b_grid.classList.toggle('on', on);
  document.getElementById('grid').classList.toggle('off', !on);
};
ui.b_orbit.onclick = () => {
  const on = !ui.b_orbit.classList.contains('on');
  ui.b_orbit.classList.toggle('on', on);
  controls.enabled = on;
};
ui.b_front.onclick = () => { frontView(); };

// Remapate pe parametrii din intro/outro (erau uDensity/uBright/uPix, ai altei formule)
bind('s_noise',  'o_noise',  v => v.toFixed(3), v => { noiseMat.uniforms.uNoise.value = v; });
bind('s_nbright','o_nbright',v => v.toFixed(2), v => { noiseMat.uniforms.uPow.value = v; });
bind('s_nsize',  'o_nsize',  v => v.toFixed(0) + 'px', v => { noiseMat.uniforms.uGrain.value = v; });
bind('s_nspeed', 'o_nspeed', v => v.toFixed(2), v => { noiseMat.uniforms.uSpeed.value = v; });
ui.c_noise.addEventListener('input', () => {
  noiseMat.uniforms.uColor.value.set(ui.c_noise.value);
  ui.o_cnoise.textContent = ui.c_noise.value;
});
bind('s_scale',  'o_scale',  v => v.toFixed(0) + '×');

/* ---------- culori ---------- */
function setLineColor(hex) {
  lineMat.color.set(hex);
  outlineMat.uniforms.uColor.value.set(hex);
  ui.o_cline.textContent = hex;
  document.documentElement.style.setProperty('--mint', hex);
}
function setBgColor(hex) {
  renderer.setClearColor(new THREE.Color(hex), 1);
  fillMat.color.set(hex);
  ui.o_cbg.textContent = hex;
  document.documentElement.style.setProperty('--bg', hex);
  document.body.style.background = hex;
}
ui.c_line.addEventListener('input', () => setLineColor(ui.c_line.value));
ui.c_bg.addEventListener('input', () => setBgColor(ui.c_bg.value));
ui.b_swap.onclick = () => {
  const a = ui.c_line.value, b = ui.c_bg.value;
  ui.c_line.value = b; ui.c_bg.value = a;
  setLineColor(b); setBgColor(a);
};
ui.b_reset.onclick = () => {
  ui.c_line.value = '#ffffff'; ui.c_bg.value = '#051b1c';
  setLineColor('#20e7b7'); setBgColor('#051b1c');
};
setLineColor(ui.c_line.value);
setBgColor(ui.c_bg.value);

/* ---------- export PNG ----------
   toDataURL e SINCRON, deci apelat direct din handler-ul de click păstrează user
   activation și descărcarea nu e blocată. (toBlob, fiind asincron, o pierde.)
   Link-ul rămâne oricum afișat, ca plasă de siguranță. */
ui.b_png.onclick = () => {
  const scale = +ui.s_scale.value;
  const prevPR = renderer.getPixelRatio();
  const w = Math.round(innerWidth * scale), h = Math.round(innerHeight * scale);
  const saved = document.getElementById('saved');
  ui.b_png.textContent = '… randez';
  try {
    renderer.setPixelRatio(scale);
    lineMat.resolution.set(w, h);
    applyFrame();
    draw();
    const url = renderer.domElement.toDataURL('image/png');
    const name = `preloader_${Math.round(progress * 100)}pc_${w}x${h}.png`;
    const a = document.createElement('a');
    a.href = url; a.download = name; a.textContent = '⬇ ' + name;
    a.click();
    saved.innerHTML = '';
    saved.appendChild(a);
    ui.b_png.textContent = '✓ gata';
  } catch (err) {
    saved.textContent = 'Eroare la export: ' + (err.message || err);
    ui.b_png.textContent = '⬇ Salvează PNG';
  } finally {
    renderer.setPixelRatio(prevPR);
    resize();
    setTimeout(() => { ui.b_png.textContent = '⬇ Salvează PNG'; }, 1600);
  }
};

addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); ui.b_loop.click(); }
  if (e.key === 'c') ui.b_close.click();
  if (e.key === 'd') ui.b_open.click();
  if (e.key === 's') ui.b_png.click();
});

resize();
</script>
</body>
</html>
