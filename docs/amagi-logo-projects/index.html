<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMAGI — Projects logo (test)</title>
    <!-- Local test page: ONLY the logo. The heading, the search bar and the
         background are built in Webflow. `.projects-logo` mirrors the Webflow
         div: absolute, 100% × 100% of the hero section. -->
    <style>
      html, body { margin: 0; background: #000; }
      .hero { position: relative; height: 100vh; height: 100dvh; }
      .projects-logo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      .after { height: 60vh; }
    </style>
    <script type="module" crossorigin src="./assets/amagi-logo.js"></script>
  </head>
  <body>
    <section class="hero">
      <div class="projects-logo"></div>
    </section>
    <div class="after"></div>

  </body>
</html>
